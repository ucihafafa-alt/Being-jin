const tips=[
'Өнөөдөр төгс хийх шаардлагагүй, зөвхөн төлөвлөгөөгөө эхлүүл.','Хоол идэхдээ утсаа хол тавьж 15 минут тайван ид.','Өлсвөл эхлээд 300 мл ус уугаад 15 минут хүлээ.','Нойр дутвал амттан идэх хүсэл нэмэгддэг тул эрт унт.','Алдаа гарсан бол дараагийн хоолноосоо үргэлжлүүл.','Өнөөдөр лифтний оронд 1–2 давхар шатаар яв.','Амттан идмээр санагдвал эхлээд усаа уугаад өөрийгөө 10 минут саатуул.','Орой хоолоо идсэний дараа дахин зууш нэмэхгүй байхыг зорь.','Өглөөний хоолоо алгасахгүй бол өдөр хэт өлсөх нь багасна.','Давсыг багасгавал хаван буурахад тусална.','Шүүс, хийжүүлсэн ундааг усаар соль.','Хоолоо жижиг тавагт хийвэл хэмжээ хянахад амар.','Өлсөх биш цадах хэмжээгээ таньж сур.','Өнөөдөр усны саваа нүдэнд харагдах газар тавь.','Гадуур хооллох бол шарсан бус чанасан/жигнэсэн сонголт хий.','Хоолоо хурдан залгихгүй, сайн зажил.','Орой унтахаас 2–3 цагийн өмнө хоолоо дуусга.','Хэмжээгээ барьсан нэг өдөр маргаашийн урам болно.','Жингээ өдөр бүр биш долоо хоногт нэг удаа үз.','Өөрийгөө шийтгэх биш дадлаа тогтоох нь зорилго.','Хоол бэлтгэлээ урьд орой нь бодож тавь.','Өдрийн хоолонд уураг заавал байлга.','Завсрын хоолыг зөвхөн үнэхээр өлссөн үед хэрэглэ.','Ногоогоо ихэсгэвэл цадалт нэмэгдэнэ.','Амттангийн оронд жимсийг бага хэмжээгээр сонго.','Ус бага уувал өлссөн мэт санагдаж болно.','Долоо хоногийн ахицаа тэмдэглэ.','Өөрчлөлт удаан санагдсан ч бие дотор ажил явагдаж байдаг.','Өнөөдөр өөртөө зөөлөн, төлөвлөгөөндөө тууштай бай.','30 дахь өдөр бол төгсгөл биш, шинэ дадлын эхлэл юм.'

function mealHtml(title,m){return `<div class="meal"><h4>${title} · ${esc(m[0])}</h4><p><b>Идэх цаг:</b> ${esc(m[1])}</p><div class="macro"><span>Хэмжээ: ${esc(m[2])}</span><span>Уурагтай</span><span>Эслэгтэй</span><span>Илчлэг хяналттай</span></div><p><b>Хийх дараалал:</b> ${esc(m[3])}</p><p><b>Ямар харагдах вэ?</b> ${esc(m[4])}</p><p><b>Ач тус:</b> ${esc(m[5])}</p><p class="warnText"><b>Анхаарах:</b> элсэн чихэр, майонез, их тос нэмэхгүй. Хэмжээг давхарлаж идэхгүй.</p></div>`}
function dayHtml(i){const p=mealPlans[(i-1)%mealPlans.length];const water=['Сэрээд 250 мл','Өглөөний хоолноос 20 минутын өмнө 200 мл','Өдрийн хоолноос өмнө 300 мл','Үдээс хойш 300 мл','Орой 200 мл'];return `<section class="dayCard"><h2>${i}-р өдөр</h2><p><b>Өдрийн зорилго:</b> хоолоо цагтаа идэх, усаа бага багаар уух, орой хүнд хоол нэмэхгүй байх.</p><div class="mealGrid">${mealHtml('Өглөө',p.b)}${mealHtml('Өдөр',p.l)}${mealHtml('Орой',p.d)}${mealHtml('Завсар',p.s)}</div><div class="panel" style="margin-top:12px"><h3>Ус ба дадал</h3><ul>${water.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>Өнөөдрийн зөвлөгөө:</b> ${esc(tips[(i-1)%tips.length])}</p><p><b>Орлуулах боломж:</b> тахиа байхгүй бол загас/үхрийн цул мах, алим байхгүй бол лийр/киви, тараг таарахгүй бол сахаргүй йогурт хэрэглэж болно.</p></div></section>`}
function weekSection(){return `<section class="dayCard"><h2>Долоо хоног бүр юу өөрчлөгдөж эхлэх вэ?</h2><ul><li><b>7 хоног:</b> хаван буурах, ус уух дадал тогтож эхлэх боломжтой.</li><li><b>14 хоног:</b> хоолны хэмжээ багасах, амттангийн хүсэл сулрах магадлалтай.</li><li><b>21 хоног:</b> бүсэлхий, хувцасны суултанд өөрчлөлт мэдрэгдэж болно.</li><li><b>30 хоног:</b> хооллох зуршил тогтож, цааш үргэлжлүүлэх суурь тавигдана.</li></ul></section>`}
function progressTable(){return `<section class="dayCard"><h2>Ахиц тэмдэглэх хүснэгт</h2><table class="progressTable"><tr><th>Хугацаа</th><th>Жин</th><th>Бүсэлхий</th><th>Тэмдэглэл</th></tr><tr><td>Эхлэл</td><td></td><td></td><td></td></tr><tr><td>7 хоног</td><td></td><td></td><td></td></tr><tr><td>14 хоног</td><td></td><td></td><td></td></tr><tr><td>21 хоног</td><td></td><td></td><td></td></tr><tr><td>30 хоног</td><td></td><td></td><td></td></tr></table></section>`}
function render(req){const d=req.data||{};const months=Number(req.packageMonths||1);const days=Math.max(30,months*30);if(req.status!=='approved'){$('report').innerHTML='<div class="panel"><h2>Тайлан хараахан батлагдаагүй байна.</h2><p>Админ төлбөр баталсны дараа энэ холбоосоор тайлан нээгдэнэ.</p></div>';return;}$('report').innerHTML=`<header class="reportHero"><h1 class="reportTitle">Эрүүл Бие — Эрүүл Жин</h1><p>${esc(d.name||'Таны')} хувийн ${months} сарын дэлгэрэнгүй төлөвлөгөө</p></header><section class="reportGrid"><div class="reportCard"><h3>Үндсэн мэдээлэл</h3><p>Нас: <b>${esc(d.age)}</b></p><p>Хүйс: <b>${d.gender==='male'?'Эрэгтэй':'Эмэгтэй'}</b></p><p>Өндөр: <b>${esc(d.height)} см</b></p><p>Жин: <b>${esc(d.weight)} кг</b></p></div><div class="reportCard"><h3>Зорилго</h3><p>Зорилтот жин: <b>${esc(d.targetWeight)} кг</b></p><p>Хасах жин: <b>${esc(req.targetLoss)} кг</b></p><p>БЖИ: <b>${esc(req.bmi)} — ${esc(req.category)}</b></p></div><div class="reportCard"><h3>Хэрэглэх заавар</h3><p>Хоол бүрийг цагтаа, аажуухан иднэ. Усны хэмжээг одоогийнхоос 300–500 мл-ээр нэмнэ. Дасгал хийхгүй өдөр ч хоол, ус, нойр хамгийн чухал.</p></div></section><section class="dayCard"><h2>Түгээмэл үед яах вэ?</h2><ul><li>Хэт өлсвөл 300 мл ус уугаад 15 минут хүлээнэ.</li><li>Гадуур хоолловол шарсан биш чанасан/жигнэсэн мах, салат сонгоно.</li><li>Найр таарвал гурил, амттан, ундааг багасгаж мах, салатаа түлхүү иднэ.</li><li>Нэг өдөр алдвал өөрийгөө буруутгахгүй, дараагийн хоолноосоо үргэлжлүүлнэ.</li></ul></section>${weekSection()}${progressTable()}${Array.from({length:days},(_,i)=>dayHtml(i+1)).join('')}<section class="dayCard"><h2>30 хоногийн дараа</h2><p>Хоолоо огцом өөрчлөхгүй. Өглөөний уураг/овьёос, өдрийн уурагтай хоол, оройн хөнгөн хоолны зарчмаа хадгал. Жингээ долоо хоногт нэг удаа нэг цагт үзэж тэмдэглэ.</p></section>`}
(async function(){if(!id){$('report').innerHTML='<div class="panel">Тайлангийн ID алга.</div>';return;}try{if(!window.EBEJ_FIREBASE_READY||!window.EBEJ_DB)throw new Error('Firebase холбогдоогүй');const doc=await window.EBEJ_DB.collection('requests').doc(id).get();if(!doc.exists){$('report').innerHTML='<div class="panel">Ийм тайлан олдсонгүй.</div>';return;}render({id:doc.id,...doc.data()});}catch(e){$('report').innerHTML='<div class="panel"><h2>Тайлан ачааллахад алдаа гарлаа</h2><p>'+esc(e.message||e)+'</p></div>';}})();
</script>
</body>
